name: Verify Mini Systems Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore namespaced branch refs for comparison
        run: git fetch origin '+refs/heads/react/*:refs/heads/react/*' '+refs/heads/redis/*:refs/heads/redis/*' '+refs/heads/dbms/*:refs/heads/dbms/*' '+refs/tags/*:refs/tags/*'
      - run: python3 scripts/verify_history.py --remote origin --fsck
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-react-fiber-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mini-react-fiber-lab/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: mini-react-fiber-lab/playwright-report/
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s . -v
        working-directory: mini-redis
      - run: python -m unittest discover -s tests -v
        working-directory: mini-dbms
